<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн-перекладач</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Онлайн-перекладач</h1>

    <div class="controls">
      <select id="source-lang" aria-label="Вихідна мова">
        <option value="uk" selected>Українська</option>
        <option value="en">Англійська</option>
        <option value="de">Німецька</option>
        <option value="fr">Французька</option>
        <option value="es">Іспанська</option>
        <option value="pl">Польська</option>
      </select>

      <button type="button" id="swap-btn">Поміняти мови місцями</button>

      <select id="target-lang" aria-label="Цільова мова">
        <option value="uk">Українська</option>
        <option value="en" selected>Англійська</option>
        <option value="de">Німецька</option>
        <option value="fr">Французька</option>
        <option value="es">Іспанська</option>
        <option value="pl">Польська</option>
      </select>
    </div>

    <div class="fields">
      <textarea id="source-text" rows="6" maxlength="500" placeholder="Введіть текст..."></textarea>
      <textarea id="target-text" rows="6" readonly placeholder="Результат перекладу..."></textarea>
    </div>

    <div class="actions">
      <button type="button" id="translate-btn">Перекласти</button>
      <p id="status"></p>
    </div>
  </main>

  <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
